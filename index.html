<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#128c7e">
<title>شات</title>
<style>
:root{--bg:#f0f2f5;--pn:#fff;--tx:#111b21;--mu:#667781;--pr:#128c7e;--out:#d9fdd3;--in:#fff;--ln:#e9edef;--rd:#d93025;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--pn:#111b21;--tx:#e9edef;--mu:#8696a0;--pr:#25d366;--out:#005c4b;--in:#202c33;--ln:#222d34;--rd:#f28b82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b141a;--pn:#111b21;--tx:#e9edef;--mu:#8696a0;--pr:#25d366;--out:#005c4b;--in:#202c33;--ln:#222d34;--rd:#f28b82;color-scheme:dark}
*{box-sizing:border-box}html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px system-ui,"Segoe UI",Tahoma,sans-serif}
button,input{font:inherit}
input{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--pn);color:var(--tx)}
input[type=checkbox]{width:auto}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff}
button.g{background:none;color:var(--pr);padding:6px 9px}
button.r{background:var(--rd);padding:5px 10px}
.card{max-width:380px;margin:8vh auto;padding:22px;background:var(--pn);border-radius:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;color:var(--pr)}
.err{color:var(--rd);font-size:13px;min-height:16px}.mu{color:var(--mu);font-size:13px}.hide{display:none!important}
#app{height:100%;display:flex;background:var(--pn)}
#side{width:100%;max-width:360px;border-inline-end:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
.bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sq{margin:8px 12px;width:auto}
#list,.ul{overflow-y:auto;flex:1}
.it{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--ln);cursor:pointer;align-items:center}
.it:hover,.it.on{background:var(--bg)}
.av{width:42px;height:42px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;position:relative}
.dot{position:absolute;bottom:0;inset-inline-end:0;width:11px;height:11px;border-radius:50%;background:#34c759;border:2px solid var(--pn)}
.t{flex:1;min-width:0}.t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--pr);color:#fff;border-radius:12px;padding:1px 8px;font-size:12px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:7px 10px;border-radius:10px;background:var(--in);word-wrap:break-word;white-space:pre-wrap;cursor:pointer}
.m.me{align-self:flex-start;background:var(--out)}.m.ot{align-self:flex-end}
.m small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.m .n{font-size:12px;color:var(--pr);font-weight:600}.m.del{color:var(--mu);font-style:italic}
.q{border-inline-start:3px solid var(--pr);background:rgba(128,128,128,.15);padding:3px 7px;border-radius:6px;margin-bottom:4px;font-size:13px;color:var(--mu)}
.rb{padding:6px 12px;background:var(--pn);border-top:1px solid var(--ln);display:flex;align-items:center;gap:8px}.rb .t{color:var(--mu)}
#form{display:flex;gap:8px;padding:10px;background:var(--pn);border-top:1px solid var(--ln)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.sh{background:var(--pn);border-radius:16px;padding:16px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:600px}
th,td{padding:8px;text-align:start;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:13px}
@media(max-width:700px){#side{max-width:none}#app.open #side{display:none}#app:not(.open) #chat{display:none}}
.md img{max-width:240px;max-height:300px;border-radius:8px;display:block;cursor:pointer}.md video{max-width:260px;max-height:300px;border-radius:8px;display:block}.md audio{width:230px;max-width:100%}.md a{color:var(--pr)}
.rx{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}.rx span{background:var(--bg);border-radius:10px;padding:1px 6px;font-size:13px}
.em{display:flex;justify-content:space-around}.em button{font-size:26px;padding:2px 6px}
</style></head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),$r=$('#root');
function h(t,a,...k){const e=document.createElement(t);for(const x in a||{}){const v=a[x];if(v==null||v===false)continue;if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v===true?'':v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:String(c));return e}
let me,users={},chats=[],members=[],msgs=[],cur=null,replyTo=null,reacts=[],hidden=new Set(),starred=new Set(),urls=new Map(),rec=null,editing=null,bub=new Map(),mwrap=new Map(),lastChat=null,tch=null,tSent=0,typingAt={},noMore={};
try{document.documentElement.dataset.theme=localStorage.theme||''}catch(e){}
const tm=t=>new Date(t).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
const dt=t=>t?new Date(t).toLocaleDateString('ar'):'—';
const nm=id=>(users[id]&&users[id].name)||'مستخدم';
const online=u=>u&&Date.now()-new Date(u.last_seen)<70000;
const mem=(c,u)=>members.find(m=>m.chat_id===c&&m.user_id===u);
const otherId=c=>(members.find(m=>m.chat_id===c.id&&m.user_id!==me.id)||{}).user_id;
const title=c=>c.is_group?(c.title||'مجموعة'):nm(otherId(c));
const vis=m=>!hidden.has(m.id);
const prev=m=>m.deleted?'🚫 رسالة محذوفة':(m.media_type&&!m.media_path)?'⏳ ملف منتهي'+(m.body?' '+m.body:''):m.media_path?(({image:'📷 صورة',video:'🎥 فيديو',audio:'🎤 رسالة صوتية'})[m.media_type]||('📎 '+(m.media_name||'ملف')))+(m.body?' '+m.body:''):m.body;
const lastOf=id=>msgs.find(m=>m.chat_id===id&&vis(m));
const unread=c=>{const t=new Date((mem(c.id,me.id)||{}).last_read_at||0);return msgs.filter(m=>m.chat_id===c.id&&m.sender_id!==me.id&&!m.deleted&&vis(m)&&new Date(m.created_at)>t).length};
function modal(...k){const o=h('div',{class:'ov',onclick:e=>{if(e.target===o)o.remove()}},h('div',{class:'sh'},...k));document.body.append(o);return o}

/* ---------- الدخول ---------- */
function authView(signup){
  $r.replaceChildren();
  const name=h('input',{placeholder:'الاسم',class:signup?'':'hide'});
  const email=h('input',{type:'email',placeholder:'البريد الإلكتروني',dir:'ltr'});
  const pw=h('input',{type:'password',placeholder:'كلمة المرور (6 أحرف على الأقل)',dir:'ltr'});
  const err=h('div',{class:'err'});
  const go=h('button',{onclick:async()=>{
    err.textContent='';const e=email.value.trim(),p=pw.value;
    if(signup&&!name.value.trim())return err.textContent='اكتب اسمك';
    const r=signup?await sb.auth.signUp({email:e,password:p,options:{data:{name:name.value.trim()}}}):await sb.auth.signInWithPassword({email:e,password:p});
    if(r.error)return err.textContent=r.error.message;
    if(!r.data.session)return err.textContent='تحقق من بريدك لتأكيد الحساب ثم سجّل الدخول';
    start();
  }},signup?'إنشاء حساب':'تسجيل الدخول');
  $r.append(h('div',{class:'card'},h('h2',{},'💬 شات'),name,email,pw,err,go,
    h('button',{class:'g',onclick:()=>authView(!signup)},signup?'لدي حساب':'إنشاء حساب جديد')));
}
async function start(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return authView(false);
  const {data}=await sb.from('profiles').select('*').eq('id',user.id).single();
  me=data;
  if(!me||me.banned){await sb.auth.signOut();$r.replaceChildren(h('div',{class:'card'},h('h2',{},'الحساب غير متاح'),h('div',{class:'mu'},'تم حظر هذا الحساب. تواصل مع المسؤول.')));return}
  mainView();await loadAll();subscribe();subTyping();setInterval(renderTyping,1000);sweep();
  setInterval(()=>{tick++;if(!rtOk||tick%10===0)poll();if((!rtOk&&tick%5===0)||tick%15===0)loadAll();if(tick%30===0)sweep()},2000);
  setInterval(async()=>{if(document.hidden)return;await sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me.id);loadMeta().then(loadUsers)},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){resync();markRead()}});
  window.addEventListener('online',resync);window.addEventListener('focus',()=>poll());
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
}

/* ---------- البيانات والمزامنة ---------- */
async function loadUsers(){const r=await sb.from('profiles').select('id,name,about,last_seen,banned');users=Object.fromEntries((r.data||[]).map(x=>[x.id,x]));renderList();renderChat()}
async function loadMeta(){const [c,m]=await Promise.all([sb.from('chats').select('*'),sb.from('chat_members').select('*')]);chats=c.data||[];members=m.data||[];renderList();renderChat()}
async function loadAll(){
  const [ms,rx,hd,st]=await Promise.all([sb.from('messages').select('*').order('created_at',{ascending:false}).limit(600),
    sb.from('reactions').select('*'),sb.from('message_hides').select('message_id'),sb.from('stars').select('message_id')]);
  const nw=ms.data||[],cut=nw.length?nw[nw.length-1].created_at:'';
  const extra=msgs.filter(x=>x.created_at<cut&&!nw.some(y=>y.id===x.id));
  msgs=[...nw,...extra];reacts=rx.data||[];
  hidden=new Set((hd.data||[]).map(x=>x.message_id));starred=new Set((st.data||[]).map(x=>x.message_id));
  await Promise.all([loadUsers(),loadMeta()]);
}
let rt;
function subscribe(){
  const ch=sb.channel('app');rt=ch;
  ch.on('postgres_changes',{event:'*',schema:'public',table:'messages'},p=>{
     const m=p.new;
     if(p.eventType==='INSERT'){
       if(msgs.some(x=>x.id===m.id))return;
       msgs.unshift(m);
       if(!chats.some(c=>c.id===m.chat_id)){loadMeta().then(loadUsers)}
       notify(m);if(m.chat_id===cur&&!document.hidden)markRead();
     }else if(p.eventType==='UPDATE')msgs=msgs.map(x=>x.id===m.id?m:x);
     else if(p.eventType==='DELETE')msgs=msgs.filter(x=>x.id!==p.old.id);
     renderList();renderChat();})
   .on('postgres_changes',{event:'*',schema:'public',table:'chat_members'},()=>loadMeta().then(loadUsers))
   .on('postgres_changes',{event:'*',schema:'public',table:'reactions'},p=>{
     const o=p.old||{},n=p.new||{};
     reacts=reacts.filter(r=>!(r.message_id===(o.message_id||n.message_id)&&r.user_id===(o.user_id||n.user_id)));
     if(p.eventType!=='DELETE')reacts.push(n);
     renderChat();})
   .subscribe(st=>{
     if(ch!==rt)return;
     rtOk=(st==='SUBSCRIBED');
     if(['CLOSED','CHANNEL_ERROR','TIMED_OUT'].includes(st))setTimeout(()=>{if(ch===rt){sb.removeChannel(ch);subscribe()}},3000);
   });
}
async function resync(){
  try{await sb.auth.getSession()}catch(e){}
  await loadAll();
}
let rtOk=false,tick=0;
let polling=false;
async function poll(){
  if(polling)return;polling=true;try{await poll2()}finally{polling=false}
}
async function poll2(){
  const newest=msgs.length?msgs[0].created_at:'1970-01-01T00:00:00Z';
  const r=await sb.from('messages').select('*').gt('created_at',newest).order('created_at',{ascending:false}).limit(200);
  const fresh=(r.data||[]).filter(m=>!msgs.some(x=>x.id===m.id));
  if(!fresh.length)return;
  msgs=[...fresh,...msgs];
  if(fresh.some(m=>!chats.some(c=>c.id===m.chat_id))){await loadMeta();await loadUsers()}
  fresh.forEach(notify);
  if(fresh.some(m=>m.chat_id===cur)&&!document.hidden)markRead();
  renderList();renderChat();
}
function notify(m){
  if(m.sender_id===me.id)return;const mm=mem(m.chat_id,me.id);if(mm&&mm.muted)return;
  if((document.hidden||cur!==m.chat_id)&&window.Notification&&Notification.permission==='granted'){
    const c=chats.find(x=>x.id===m.chat_id);
    new Notification(c?title(c):'رسالة جديدة',{body:nm(m.sender_id)+': '+prev(m).slice(0,80)});
  }
}
async function markRead(){
  if(!cur)return;const t=new Date().toISOString(),mm=mem(cur,me.id);if(mm)mm.last_read_at=t;
  renderList();await sb.from('chat_members').update({last_read_at:t}).eq('chat_id',cur).eq('user_id',me.id);
}

/* ---------- الواجهة ---------- */
function mainView(){
  $r.replaceChildren();
  const app=h('div',{id:'app'},
    h('div',{id:'side'},
      h('div',{class:'bar'},h('b',{id:'myname',onclick:settings,style:'cursor:pointer'},me.name),
        me.is_admin&&h('button',{class:'g',onclick:newChat},'＋ جديدة'),h('button',{class:'g',onclick:settings},'⚙️')),
      h('input',{id:'sq',placeholder:'بحث في المحادثات',oninput:renderList}),
      h('div',{id:'list'})),
    h('div',{id:'chat'},
      h('div',{class:'bar'},h('button',{class:'g',onclick:()=>$('#app').classList.remove('open')},'→'),h('b',{id:'ct'}),
        h('button',{class:'g',id:'bp',onclick:()=>toggle('pinned')},'📌'),h('button',{class:'g',id:'bm',onclick:()=>toggle('muted')},'🔔')),
      h('div',{style:'display:flex;align-items:center;background:var(--pn)'},h('button',{class:'g',id:'older',onclick:loadOlder},'⬆ رسائل أقدم'),h('div',{id:'ty',class:'mu',style:'padding:0 8px'})),
      h('div',{id:'msgs'}),
      h('div',{class:'rb hide',id:'rb'},h('div',{class:'t',id:'rt'}),h('button',{class:'g',onclick:cancelBar},'✕')),
      h('form',{id:'form',onsubmit:send},
        h('button',{type:'button',class:'g',onclick:()=>$('#fi').click()},'📎'),
        h('input',{id:'inp',placeholder:'اكتب رسالة',autocomplete:'off',oninput:typing}),
        h('button',{type:'button',id:'mic',class:'g',onclick:micToggle},'🎤'),
        h('button',{type:'button',id:'cancelrec',class:'g hide',onclick:()=>rec&&rec.cancel()},'✕'),
        h('button',{type:'submit'},'إرسال')),
      h('input',{type:'file',id:'fi',class:'hide',onchange:pick})));
  $r.append(app);
}
function renderList(){
  const l=$('#list');if(!l)return;const q=($('#sq').value||'').toLowerCase();
  $('#myname').textContent=me.name;
  const tu=chats.reduce((t,c)=>t+unread(c),0);document.title=(tu?'('+tu+') ':'')+'شات';
  const rows=chats.filter(c=>title(c).toLowerCase().includes(q)).map(c=>({c,m:lastOf(c.id),p:(mem(c.id,me.id)||{}).pinned}))
    .sort((a,b)=>(b.p-a.p)||(new Date(b.m?b.m.created_at:0)-new Date(a.m?a.m.created_at:0)));
  l.replaceChildren(...rows.map(({c,m,p})=>{
    const o=c.is_group?null:users[otherId(c)],u=unread(c);
    return h('div',{class:'it'+(cur===c.id?' on':''),onclick:()=>openChat(c.id)},
      h('div',{class:'av'},c.is_group?'👥':title(c).slice(0,1),online(o)&&h('span',{class:'dot'})),
      h('div',{class:'t'},h('div',{},h('b',{},(p?'📌 ':'')+title(c))),h('div',{class:'mu'},m?prev(m):'لا رسائل بعد')),
      u>0&&h('span',{class:'badge'},u));
  }));
  if(!rows.length)l.append(h('div',{class:'mu',style:'padding:16px'},(me.is_admin?'لا محادثات. اضغط ＋ جديدة للبدء.':'لا محادثات بعد.')));
}
function openChat(id){cur=id;replyTo=null;$('#app').classList.add('open');setReply(null);renderList();renderChat();markRead()}
function sigOf(m,o){
  const rp=m.reply_to&&msgs.find(x=>x.id===m.reply_to);
  return [m.deleted,m.body,m.edited,m.reply_to,m.media_path,starred.has(m.id),!!(o&&new Date(o.last_read_at)>=new Date(m.created_at)),
    reacts.filter(r=>r.message_id===m.id).map(r=>r.user_id+r.emoji).sort().join(),rp?rp.deleted+''+rp.body:''].join('|');
}
async function getUrl(p){
  const c=urls.get(p);if(c&&c.exp>Date.now())return c.u;
  const r=await sb.storage.from('chat-media').createSignedUrl(p,3600);
  if(r.error||!r.data)return null;urls.set(p,{u:r.data.signedUrl,exp:Date.now()+3000000});return r.data.signedUrl;
}
const seen=new Set();
function markViewed(m){if(m.sender_id===me.id||seen.has(m.id))return;seen.add(m.id);sb.rpc('mark_media_viewed',{p_id:m.id})}
let sweeping=false;
async function sweep(){
  if(sweeping)return;sweeping=true;
  try{
    const r=await sb.rpc('expired_media'),rows=r.data||[];
    if(!rows.length)return;
    const rm=await sb.storage.from('chat-media').remove(rows.map(x=>x.media_path));
    if(rm.error)return;
    for(const x of rows){
      await sb.rpc('finish_media_expiry',{p_id:x.id});mwrap.delete(x.id);urls.delete(x.media_path);
      msgs=msgs.map(y=>y.id===x.id?{...y,media_path:null}:y);
    }
    renderList();renderChat();
  }catch(e){}finally{sweeping=false}
}
function mediaWrap(m){
  if(mwrap.has(m.id))return mwrap.get(m.id);
  const w=h('div',{class:'md'});mwrap.set(m.id,w);
  getUrl(m.media_path).then(u=>{
    if(!u){w.textContent='⚠️ تعذر تحميل الملف';return}
    const stop=e=>e.stopPropagation(),view=()=>markViewed(m);
    if(m.media_type==='image'){
      const im=h('img',{src:u,onclick:e=>{stop(e);modal(h('img',{src:u,style:'max-width:100%;border-radius:8px'}))}});w.append(im);
      const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&!document.hidden){view();io.disconnect()}},{threshold:.5});io.observe(im);
    }
    else if(m.media_type==='video')w.append(h('video',{src:u,controls:true,preload:'metadata',onclick:stop,onplay:view}));
    else if(m.media_type==='audio')w.append(h('audio',{src:u,controls:true,preload:'metadata',onclick:stop,onplay:view}));
    else w.append(h('a',{href:u,target:'_blank',onclick:e=>{stop(e);view()}},'📎 '+(m.media_name||'ملف')));
    w.append(h('div',{class:'mu',style:'font-size:11px'},'⏳ تُحذف بعد 24 ساعة من مشاهدتها'));
  });
  return w;
}
function bubble(m,c,o){
  const mine=m.sender_id===me.id,rp=m.reply_to&&msgs.find(x=>x.id===m.reply_to);
  const read=o&&new Date(o.last_read_at)>=new Date(m.created_at),grp={};
  reacts.filter(r=>r.message_id===m.id).forEach(r=>grp[r.emoji]=(grp[r.emoji]||0)+1);
  return h('div',{class:'m '+(mine?'me':'ot')+(m.deleted?' del':''),onclick:()=>sheet(m)},
    c.is_group&&!mine&&h('div',{class:'n'},nm(m.sender_id)),
    rp&&h('div',{class:'q'},nm(rp.sender_id)+': '+prev(rp).slice(0,60)),
    m.media_path&&!m.deleted&&mediaWrap(m),
    m.media_type&&!m.media_path&&!m.deleted&&h('div',{class:'mu'},'⏳ انتهت صلاحية هذا الملف (حُذف تلقائياً لتوفير المساحة)'),
    m.deleted?'🚫 تم حذف هذه الرسالة':(m.body||null),
    Object.keys(grp).length>0&&h('div',{class:'rx'},...Object.entries(grp).map(([e,n])=>h('span',{},e+(n>1?' '+n:'')))),
    h('small',{},(starred.has(m.id)?'⭐ ':'')+(m.edited&&!m.deleted?'(معدلة) ':'')+tm(m.created_at)+(mine&&!m.deleted?(read?' ✓✓':' ✓'):'')));
}
function renderChat(keep){
  const box=$('#msgs');if(!box)return;const c=chats.find(x=>x.id===cur);
  if(!c){$('#ct').textContent='اختر محادثة';box.replaceChildren();bub.clear();$('#older').classList.add('hide');return}
  $('#ct').textContent=title(c);const mm=mem(cur,me.id)||{};
  $('#bp').style.opacity=mm.pinned?1:.4;$('#bm').textContent=mm.muted?'🔕':'🔔';
  $('#older').classList.toggle('hide',!!noMore[cur]);
  const o=c.is_group?null:members.find(x=>x.chat_id===cur&&x.user_id!==me.id);
  if(lastChat!==cur){box.replaceChildren();bub.clear();lastChat=cur}
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<150,h0=box.scrollHeight,fresh=!box.children.length;
  const list=msgs.filter(m=>m.chat_id===cur&&vis(m)).slice().reverse(),ids=new Set(list.map(m=>m.id));
  for(const [id,b] of [...bub])if(!ids.has(id)){b.el.remove();bub.delete(id)}
  list.forEach((m,i)=>{
    const sig=sigOf(m,o);let b=bub.get(m.id);
    if(!b||b.sig!==sig){const el=bubble(m,c,o);if(b&&b.el.parentNode)b.el.replaceWith(el);b={el,sig};bub.set(m.id,b)}
    const ref=box.children[i];if(ref!==b.el)box.insertBefore(b.el,ref||null);
  });

async function loadOlder(){

async function send(e){

async function shrink(f){
  if(!f.type.startsWith('image/')||f.type==='image/gif')return f;
  try{
    const bm=await createImageBitmap(f),k=Math.min(1,1000/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.72));
    return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f;
  }catch(e){return f}
}
async function pick(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const t=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':f.type.startsWith('audio/')?'audio':'file';
  sendMedia(t==='image'?await shrink(f):f,t);

async function sendMedia(file,type){
  if(!cur)return;
  if(file.size>10*1024*1024)return alert('الحجم الأقصى للملف 10 ميجابايت');
  const inp=$('#inp'),ph=inp.placeholder;inp.placeholder='جارٍ الرفع…';
  const ext=((file.name||'').split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,8)||'bin';
  const path=cur+'/'+me.id+'/'+crypto.randomUUID()+'.'+ext;
  const up=await sb.storage.from('chat-media').upload(path,file,{contentType:file.type||'application/octet-stream'});
  inp.placeholder=ph;
  if(up.error)return alert('تعذر رفع الملف: '+up.error.message);
  const {data,error}=await sb.from('messages').insert({chat_id:cur,sender_id:me.id,body:'',media_path:path,media_type:type,media_name:file.name||'',media_size:file.size,reply_to:replyTo?replyTo.id:null}).select().single();
  if(error){await sb.storage.from('chat-media').remove([path]);return alert('تعذر الإرسال: '+error.message)}
  afterSend(data);
}
function setMic(on){

async function micToggle(){
  if(rec){rec.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=window.MediaRecorder&&MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/mp4';
    const mr=new MediaRecorder(st,{mimeType:mt}),chunks=[];let cancelled=false;
    mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());rec=null;setMic(false);
      if(!cancelled&&chunks.length)sendMedia(new File(chunks,'voice.'+(mt==='audio/webm'?'webm':'m4a'),{type:mt}),'audio')};
    mr.cancel=()=>{cancelled=true;mr.stop()};
    mr.start();rec=mr;setMic(true);
  }catch(e){alert('تعذر الوصول للمايكروفون. اسمح له من إعدادات المتصفح.')}

async function react(m,e){
